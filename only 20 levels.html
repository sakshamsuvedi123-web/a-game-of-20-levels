<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diesel Rig & Quantum Pads - Ultimate Arcade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a24 0%, #0d0d12 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Top-Left Guide Button */
        #guide-btn-top {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
            transition: transform 0.2s;
            z-index: 10;
        }
        #guide-btn-top:hover {
            transform: scale(1.05);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(255, 140, 0, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 140, 0, 0.3);
            width: 400px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Dimension Warp Transition Animation */
        .dimension-warp {
            animation: warpEffect 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes warpEffect {
            0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg) blur(0px); }
            50% { transform: scale(2.5) rotate(180deg); filter: hue-rotate(360deg) blur(10px); opacity: 0.2; }
            100% { transform: scale(1) rotate(360deg); filter: hue-rotate(720deg) blur(0px); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake {
            animation: shake 0.4s;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2rem;
            background: linear-gradient(45deg, #ff8c00, #ff3300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
        }

        .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffaa00;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .panel-screen {
            background: #111;
            border: 2px inset #333;
            border-radius: 12px;
            padding: 25px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        #status-msg {
            font-size: 1.05rem;
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Loading Bar Styles */
        #loader-container {
            width: 100%;
            background: #222;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid #444;
            display: none;
        }
        #loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #ff3300);
            transition: width 0.1s linear;
        }

        /* Interactive Simulator Buttons */
        .sim-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff8c00, #ff3300);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            display: none;
            margin: 0 auto;
        }
        .sim-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.7);
        }
        .sim-btn:active {
            transform: scale(0.95);
        }

        /* Dashboard */
        #dashboard {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .gauge {
            font-size: 1.1rem;
            color: #00ffcc;
            font-family: monospace;
            background: #000;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #00ffcc55;
        }
        .throttle-btn {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            padding: 10px 15px;
            font-size: 0.9rem;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 176, 155, 0.4);
        }
        .launch-game-btn {
            background: linear-gradient(45deg, #00d2ff, #ff007f);
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            margin-top: 5px;
        }

        /* Quantum Pads Styles (Hidden initially) */
        #quantum-pads-section {
            display: none;
        }
        #level-info {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #ff007f;
            font-weight: bold;
        }
        #message {
            font-size: 0.95rem;
            margin-bottom: 20px;
            height: 24px;
            color: #ffeb3b;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 12px;
            justify-content: center;
            width: 294px;
            margin: 0 auto;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pad {
            background-color: #3b3b5c;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s, opacity 0.3s, filter 0.3s;
        }
        .pad:active {
            transform: scale(0.92);
        }
        .pad.active-cyan {
            background-color: #00ffff !important;
            box-shadow: 0 0 30px #00ffff, inset 0 0 15px #ffffff;
        }
        .pad.active-magenta {
            background-color: #ff00ff !important;
            box-shadow: 0 0 30px #ff00ff, inset 0 0 15px #ffffff;
        }
        .pad.active-lime {
            background-color: #39ff14 !important;
            box-shadow: 0 0 30px #39ff14, inset 0 0 15px #ffffff;
        }
        .pad.active-orange {
            background-color: #ff5e00 !important;
            box-shadow: 0 0 30px #ff5e00, inset 0 0 15px #ffffff;
        }
        .pad.decoy {
            background-color: #ff3333 !important;
            box-shadow: 0 0 25px #ff3333;
            filter: brightness(1.3);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .game-btn {
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-btn:hover {
            transform: scale(1.05);
        }
        .game-btn:disabled {
            background: #555 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #repeat-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }
        #quit-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        /* Modal Overlay for Level Guide & Teleport */
        #guide-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #252538;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            text-align: left;
        }
        .modal-content h2 {
            color: #00d2ff;
            margin-top: 0;
            text-align: center;
        }
        .level-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
        }
        .teleport-btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: transform 0.1s;
        }
        .teleport-btn:hover {
            transform: scale(1.1);
        }
        .close-modal {
            display: block;
            margin: 25px auto 0 auto;
            padding: 8px 20px;
            background: #ff007f;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Outside Portal Start Button */
        @keyframes glowing {
            0% { box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff, 0 0 45px #00d2ff; }
            50% { box-shadow: 0 0 25px #ff007f, 0 0 45px #ff007f, 0 0 65px #ff007f; }
            100% { box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff, 0 0 45px #00d2ff; }
        }
        #start-btn-outside {
            display: none;
            margin-top: 25px;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #00d2ff, #ff007f);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            cursor: pointer;
            letter-spacing: 2px;
            animation: glowing 2.5s infinite;
            transition: transform 0.2s;
        }
        #start-btn-outside:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- Top-Left Level Guide Button -->
    <button id="guide-btn-top" onclick="promptPassword()">🔒 Level Guide</button>

    <div class="container" id="main-container">
        
        <!-- DIESEL RIG SIMULATOR SECTION -->
        <div id="diesel-section">
            <h1 id="main-title">Diesel Rig</h1>
            <div class="subtitle" id="main-subtitle">Heavy Engine Simulator</div>
            
            <div class="panel-screen">
                <div id="status-msg">System Offline. Ready for Ignition.</div>
                <div id="loader-container">
                    <div id="loader-bar"></div>
                </div>
                
                <div id="dashboard">
                    <div class="gauge">RPM: <span id="rpm-val">600</span></div>
                    <div class="gauge">STATUS: <span id="engine-state">IDLE & READY</span></div>
                    <button class="throttle-btn" onmousedown="revEngine(true)" onmouseup="revEngine(false)" ontouchstart="revEngine(true)" ontouchend="revEngine(false)">REV THROTTLE 🚜</button>
                    <button class="launch-game-btn" onclick="triggerDimensionWarp()">🎮 LAUNCH QUANTUM PADS</button>
                </div>
            </div>

            <!-- Step 1 Button -->
            <button id="ignition-btn" class="sim-btn" style="display: block;" onclick="startIgnition()">⚡ START IGNITION</button>
            
            <!-- Step 3 Button -->
            <button id="engine-btn" class="sim-btn" onclick="startEngine()">🚜 START ENGINE</button>
        </div>

        <!-- QUANTUM PADS SECTION -->
        <div id="quantum-pads-section">
            <h1 style="font-size: 2.2rem; background: linear-gradient(45deg, #00d2ff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Quantum Pads</h1>
            <div class="subtitle" style="color:#00ffff;">⚡ Ultimate Edition ⚡</div>
            <div id="level-info">Level: 1 / 20</div>
            <div id="message">Repeat the pattern!</div>
            
            <div class="grid" id="grid">
                <button class="pad" data-index="0"></button>
                <button class="pad" data-index="1"></button>
                <button class="pad" data-index="2"></button>
                <button class="pad" data-index="3"></button>
                <button class="pad" data-index="4"></button>
                <button class="pad" data-index="5"></button>
                <button class="pad" data-index="6"></button>
                <button class="pad" data-index="7"></button>
                <button class="pad" data-index="8"></button>
            </div>

            <div class="btn-group">
                <button id="repeat-btn" class="game-btn" onclick="repeatSequence()" disabled>🔄 Repeat</button>
                <button id="quit-btn" class="game-btn" onclick="quitGame()">🚪 Quit</button>
            </div>
        </div>

    </div>

    <!-- Outside Portal Start Button for Quantum Pads -->
    <button id="start-btn-outside" onclick="startQuantumGame()">🚀 ENTER DIMENSION</button>

    <!-- Level Guide & Teleport Modal -->
    <div id="guide-modal">
        <div class="modal-content">
            <h2>Level Teleport Directory</h2>
            <div id="directory-list"></div>
            <button class="close-modal" onclick="closeGuide()">Close</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let engineOscillator = null;
        let engineGain = null;
        let isRevving = false;

        const statusMsg = document.getElementById('status-msg');
        const loaderContainer = document.getElementById('loader-container');
        const loaderBar = document.getElementById('loader-bar');
        const ignitionBtn = document.getElementById('ignition-btn');
        const engineBtn = document.getElementById('engine-btn');
        const dashboard = document.getElementById('dashboard');
        const rpmVal = document.getElementById('rpm-val');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Diesel Step 1: Ignition Pressed
        function startIgnition() {
            initAudio();
            ignitionBtn.style.display = 'none';
            statusMsg.innerText = "Initializing Electrical Systems...";
            
            loaderContainer.style.display = 'block';
            let width = 0;
            
            let loadInterval = setInterval(() => {
                width += 2;
                loaderBar.style.width = width + '%';
                
                if (width === 40) statusMsg.innerText = "Checking Fuel Pressure...";
                if (width === 80) statusMsg.innerText = "Glow Plugs Heating...";
                
                if (width >= 100) {
                    clearInterval(loadInterval);
                    loaderContainer.style.display = 'none';
                    statusMsg.innerText = "Ignition Sequence Ready!";
                    engineBtn.style.display = 'block';
                }
            }, 30);
        }

        // Diesel Step 2 & 3: Start Engine & Play Diesel Sound
        function startEngine() {
            engineBtn.style.display = 'none';
            statusMsg.innerText = "Cranking Heavy Diesel Engine...";
            playCrankingSound();

            setTimeout(() => {
                statusMsg.style.display = 'none';
                dashboard.style.display = 'flex';
                playContinuousDieselIdle();
            }, 2000);
        }

        function playCrankingSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(45, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 1.5);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.0);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 2.0);
        }

        function playContinuousDieselIdle() {
            if (!audioCtx) return;
            engineOscillator = audioCtx.createOscillator();
            let filter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            engineOscillator.type = 'sawtooth';
            engineOscillator.frequency.setValueAtTime(35, audioCtx.currentTime);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(180, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

            engineOscillator.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOscillator.start();
        }

        function revEngine(revving) {
            isRevving = revving;
            if (!engineOscillator || !audioCtx) return;

            let targetFreq = revving ? 95 : 35;
            let targetRpm = revving ? 2400 : 600;
            engineOscillator.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            
            let currentRpm = parseInt(rpmVal.innerText);
            let rpmInterval = setInterval(() => {
                let diff = targetRpm - currentRpm;
                if (Math.abs(diff) < 10) {
                    currentRpm = targetRpm;
                    clearInterval(rpmInterval);
                } else {
                    currentRpm += diff * 0.2;
                }
                rpmVal.innerText = Math.round(currentRpm);
            }, 50);
        }

        // --- QUANTUM PADS LOGIC & WARP ---
        const container = document.getElementById('main-container');
        const dieselSection = document.getElementById('diesel-section');
        const quantumPadsSection = document.getElementById('quantum-pads-section');
        const startBtnOutside = document.getElementById('start-btn-outside');
        const guideBtnTop = document.getElementById('guide-btn-top');
        const pads = document.querySelectorAll('.pad');
        const message = document.getElementById('message');
        const levelInfo = document.getElementById('level-info');
        const repeatBtn = document.getElementById('repeat-btn');
        const grid = document.getElementById('grid');
        const guideModal = document.getElementById('guide-modal');
        const directoryList = document.getElementById('directory-list');

        let currentLevel = 1;
        let sequence = [];
        let playerSequence = [];
        let waitingForPlayer = false;
        let currentRotation = 0;
        let hasRepeatedThisLevel = false;

        const colorClasses = ['active-cyan', 'active-magenta', 'active-lime', 'active-orange'];

        function getLevelConfig(lvl) {
            let len = Math.min(lvl, 6);
            let speed = 900 - (lvl * 25);
            if (speed < 300) speed = 300;

            return {
                length: len,
                speed: speed,
                reverse: lvl % 4 === 0,
                decoy: [3, 7, 11, 15, 19].includes(lvl),
                rotateOnPlay: lvl >= 5 && lvl % 2 !== 0,
                screenPulse: lvl >= 8,
                scramble: lvl >= 12
            };
        }

        function triggerDimensionWarp() {
            // Stop diesel sound when warping
            if (engineOscillator) {
                try { engineOscillator.stop(); } catch(e) {}
            }
            container.classList.add('dimension-warp');
            setTimeout(() => {
                container.classList.remove('dimension-warp');
                dieselSection.style.display = 'none';
                quantumPadsSection.style.display = 'block';
                guideBtnTop.style.display = 'block';
                startBtnOutside.style.display = 'block';
                startBtnOutside.innerText = "🚀 START QUANTUM GAME";
            }, 800);
        }

        function startQuantumGame() {
            startBtnOutside.style.display = 'none';
            currentLevel = 1;
            currentRotation = 0;
            loadLevel();
        }

        function promptPassword() {
            let pass = prompt("Enter password to unlock Level Teleport:");
            if (pass === "binod") {
                showGuide();
            } else if (pass !== null) {
                alert("Incorrect password!");
            }
        }

        function showGuide() {
            let html = "";
            for (let i = 1; i <= 20; i++) {
                let cfg = getLevelConfig(i);
                let perks = [];
                if (cfg.reverse) perks.push("🔄 Rev");
                if (cfg.decoy) perks.push("⚠️ Decoy");
                if (cfg.rotateOnPlay) perks.push("🌀 Shift");
                if (cfg.screenPulse) perks.push("✨ Pulse");
                if (cfg.scramble) perks.push("🔀 Scramble");
                if (perks.length === 0) perks.push("Standard");

                html += `
                    <div class="level-row">
                        <div>
                            <strong>Lvl ${i}</strong> (${cfg.length} blinks)<br>
                            <span style="font-size:0.75rem; color:#aaa;">${perks.join(", ")}</span>
                        </div>
                        <button class="teleport-btn" onclick="teleportToLevel(${i})">Play Level</button>
                    </div>`;
            }
            directoryList.innerHTML = html;
            guideModal.style.display = "flex";
        }

        function closeGuide() {
            guideModal.style.display = "none";
        }

        function teleportToLevel(lvl) {
            currentLevel = lvl;
            currentRotation = 0;
            closeGuide();
            startBtnOutside.style.display = "none";
            loadLevel();
        }

        function quitGame() {
            alert("Bro really rage quitting on Level " + currentLevel + "? Skill issue! 😂, keep crying! 💀");
            try { window.close(); } catch(e) {}
            document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;color:#ff007f;font-size:2rem;font-family:sans-serif;'>💀 Game Over. Bro rage quit successfully! 😂</div>";
        }

        function loadLevel() {
            if (currentLevel > 20) {
                message.innerText = "🏆 Victory! Master of the Grid!";
                startBtnOutside.innerText = "PLAY AGAIN";
                startBtnOutside.style.display = "block";
                repeatBtn.disabled = true;
                return;
            }

            levelInfo.innerText = `Level: ${currentLevel} / 20`;
            playerSequence = [];
            currentRotation = 0;
            grid.style.transform = `rotate(0deg)`;
            hasRepeatedThisLevel = false;
            
            const config = getLevelConfig(currentLevel);
            
            sequence = [];
            for(let i = 0; i < config.length; i++) {
                sequence.push({
                    index: Math.floor(Math.random() * 9),
                    color: colorClasses[Math.floor(Math.random() * colorClasses.length)]
                });
            }

            repeatBtn.disabled = true;
            playSequence();
        }

        async function playSequence() {
            waitingForPlayer = false;
            const config = getLevelConfig(currentLevel);
            
            message.innerText = config.reverse ? "⚡ Watch Sequence (REVERSE ORDER!)" : "⚡ Watch the Sequence...";
            await sleep(800);

            for (let i = 0; i < sequence.length; i++) {
                let step = sequence[i];
                let pad = pads[step.index];

                if (config.screenPulse) {
                    document.body.style.background = `radial-gradient(circle, #2c2c54, #111119)`;
                }

                if (config.rotateOnPlay && i === Math.floor(sequence.length / 2)) {
                    message.innerText = "🌀 Board Shift!";
                    currentRotation += 90;
                    grid.style.transform = `rotate(${currentRotation}deg)`;
                    container.classList.add('shake');
                    setTimeout(() => container.classList.remove('shake'), 400);
                    await sleep(500);
                    message.innerText = config.reverse ? "⚡ Watch Sequence (REVERSE ORDER!)" : "⚡ Watch the Sequence...";
                }

                pad.classList.add(step.color);
                await sleep(config.speed);
                pad.classList.remove(step.color);

                if (config.decoy && Math.random() > 0.5) {
                    let decoyIdx = (step.index + 2) % 9;
                    pads[decoyIdx].classList.add('decoy');
                    await sleep(200);
                    pads[decoyIdx].classList.remove('decoy');
                }

                await sleep(config.speed / 2);
            }

            document.body.style.background = "radial-gradient(circle at center, #1e1e3f 0%, #0f0f1a 100%)";
            waitingForPlayer = true;
            message.innerText = config.reverse ? "👉 Your Turn! Click in REVERSE order" : "👉 Your Turn! Repeat the pattern";
            
            if (!hasRepeatedThisLevel) {
                repeatBtn.disabled = false;
            }
        }

        function repeatSequence() {
            if (!waitingForPlayer || hasRepeatedThisLevel) return;
            hasRepeatedThisLevel = true;
            repeatBtn.disabled = true;
            playerSequence = [];
            playSequence();
        }

        pads.forEach(pad => {
            pad.addEventListener('click', () => {
                if (!waitingForPlayer) return;

                const idx = parseInt(pad.getAttribute('data-index'));
                playerSequence.push(idx);

                pad.classList.add('active-cyan');
                setTimeout(() => pad.classList.remove('active-cyan'), 200);

                const config = getLevelConfig(currentLevel);
                const currentIndex = playerSequence.length - 1;

                let targetStep = config.reverse ? sequence[sequence.length - 1 - currentIndex] : sequence[currentIndex];

                if (idx !== targetStep.index) {
                    waitingForPlayer = false;
                    repeatBtn.disabled = true;
                    
                    currentLevel = Math.max(1, currentLevel - 1);
                    message.innerText = "❌ Try again!";
                    
                    container.classList.add('shake');
                    setTimeout(() => container.classList.remove('shake'), 400);
                    
                    setTimeout(loadLevel, 1200);
                    return;
                }

                if (config.scramble && playerSequence.length === Math.floor(sequence.length / 2)) {
                    message.innerText = "⚡ Grid Scrambled!";
                    currentRotation += 180;
                    grid.style.transform = `rotate(${currentRotation}deg)`;
                }

                if (playerSequence.length === sequence.length) {
                    waitingForPlayer = false;
                    repeatBtn.disabled = true;
                    message.innerText = "✨ Level Cleared! Awesome!";
                    currentLevel++;
                    setTimeout(loadLevel, 1500);
                }
            });
        });

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
